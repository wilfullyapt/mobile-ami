models:
  stt:
    name: tiny
    backend: cpu
    quant: int8
    path: null                           # -> ~/.amini/models/stt/ (download_root)
    version: tiny
    eager: false
  tts:
    name: en_US-lessac-medium
    backend: cpu
    quant: none
    path: en_US-lessac-medium.onnx       # filename -> ~/.amini/models/tts/en_US-lessac-medium.onnx
    version: medium
    eager: false
  llm:
    name: llama3.2:1b
    backend: cpu
    quant: none
    path: null                           # -> ~/.amini/models/llm/ (OLLAMA_MODELS dir)
    version: "1b"
    eager: false
  wake:
    name: hey_assistant
    backend: cpu
    quant: none
    path: null                           # -> ~/.amini/models/wake/ (download target)
    version: hey_assistant
    eager: true                          # loaded at startup for instant detection
  vad:
    name: webrtcvad
    backend: cpu
    quant: none
    path: null
    version: "2"                         # sensitivity level (0-3)
    eager: true
  speaker:
    name: resemblyzer-ge2e
    backend: cpu
    quant: none
    path: null                           # -> ~/.amini/models/speaker/ (model weights cache)
    version: "ge2e"
    eager: false                         # loaded on first voice interaction

auto_update:
  enabled: true
  channel: stable
  check_interval_sec: 1800
  min_battery_pct: 30
  health_check_retries: 3
  repo_path: null                      # null = auto-detect from project root

device:
  display_timeout_sec: 15
  hotspot_ssid: "AminiAI"
  hotspot_password: "amini123"
  wifi_rollover_timeout_sec: 20    # seconds to wait for WiFi before falling back to hotspot

device_server:
  enabled: true
  port: 5000

button_pins:
  power: 17
  action: 27
  interaction: 22

default_agent: "qa"

ally:
  # Current interaction mode: manual | hot_word | ally
  # Persisted to settings.json; this is just the default on first boot.
  interaction_mode: hot_word

  # Ally mode: how confident the LLM must be to speak autonomously (0–1).
  # Currently gates whether the LLM SPEAK/SILENT decision is acted on.
  threshold: 0.6

  # How often (seconds) AllyListener evaluates ambient context to decide whether to speak.
  check_interval_sec: 30

  # Seconds of ambient audio context to retain in the rolling buffer.
  ambient_buffer_sec: 120

  # Max utterances to keep in the ambient context buffer.
  max_ambient_utterances: 20

  # Time of day for the daily eval_day run (HH:MM, 24-hour local time).
  eval_day_time: "03:00"

  # If true, eval_day appends a dated digest to soul.md after each evaluation.
  update_soul_on_eval: false

  # Owner considered "absent" from room if not heard for this many seconds.
  owner_absent_threshold_sec: 300
